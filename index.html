<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alexis Gros — Élève Ingénieur ENSEEIHT</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #fafafa;
      --surface: #ffffff;
      --border: #e2e8f0;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --accent: #0f172a;
      --accent-hover: #1e293b;
      --tag-bg: #f1f5f9;
      --tag-text: #334155;
      --radius: 8px;
      --transition: 0.2s ease;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    /* Gestion bilingue */
    html[lang="fr"] .lang-en {
      display: none !important;
    }
    html[lang="en"] .lang-fr {
      display: none !important;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      line-height: 1.6;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* En-tête & Barre de navigation */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .nav-container {
      max-width: 900px;
      margin: 0 auto;
      padding: 0.85rem 1.25rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
    }

    .brand {
      font-weight: 700;
      font-size: 1.05rem;
      color: var(--text-main);
      text-decoration: none;
      letter-spacing: -0.02em;
      white-space: nowrap;
    }

    .brand span {
      font-weight: 400;
      color: var(--text-muted);
    }

    .nav-group {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    nav {
      display: flex;
      gap: 0.25rem;
    }

    .nav-btn {
      background: none;
      border: none;
      font-family: inherit;
      font-size: 0.88rem;
      font-weight: 500;
      color: var(--text-muted);
      padding: 0.4rem 0.65rem;
      border-radius: var(--radius);
      cursor: pointer;
      transition: color var(--transition), background-color var(--transition);
      white-space: nowrap;
    }

    .nav-btn:hover {
      color: var(--text-main);
      background-color: var(--tag-bg);
    }

    .nav-btn.active {
      color: var(--text-main);
      background-color: var(--tag-bg);
      font-weight: 600;
    }

    /* Bouton bascule de langue visible et contrasté */
    .lang-toggle-btn {
      background: #0f172a;
      color: #ffffff;
      border: 1px solid #0f172a;
      font-family: inherit;
      font-size: 0.8rem;
      font-weight: 600;
      padding: 0.35rem 0.75rem;
      border-radius: var(--radius);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      white-space: nowrap;
      transition: background-color var(--transition), opacity var(--transition);
      flex-shrink: 0;
    }

    .lang-toggle-btn:hover {
      background: #334155;
    }

    /* Contenu */
    main {
      flex: 1;
      max-width: 900px;
      width: 100%;
      margin: 0 auto;
      padding: 3rem 1.5rem;
    }

    .page {
      display: none;
      animation: fadeIn 0.25s ease-out;
    }

    .page.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h1 {
      font-size: 2.25rem;
      letter-spacing: -0.03em;
      font-weight: 700;
      margin-bottom: 1rem;
      line-height: 1.2;
    }

    h2 {
      font-size: 1.4rem;
      letter-spacing: -0.02em;
      font-weight: 600;
      margin-bottom: 1.5rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.5rem;
    }

    p {
      color: var(--text-muted);
      margin-bottom: 1.25rem;
      font-size: 1rem;
    }

    .lead {
      font-size: 1.15rem;
      color: var(--text-main);
      margin-bottom: 2rem;
      max-width: 700px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1.5rem;
    }

    @media (min-width: 680px) {
      .grid-2 {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: border-color var(--transition);
    }

    .card:hover {
      border-color: #cbd5e1;
    }

    .card-header {
      margin-bottom: 0.75rem;
    }

    .card-title {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 0.25rem;
    }

    .card-subtitle {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .card p {
      font-size: 0.95rem;
      margin-bottom: 1rem;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin-top: auto;
    }

    .tag {
      background: var(--tag-bg);
      color: var(--tag-text);
      font-size: 0.75rem;
      font-weight: 500;
      padding: 0.25rem 0.55rem;
      border-radius: 4px;
    }

    .timeline {
      display: flex;
      flex-direction: column;
      gap: 2rem;
    }

    .timeline-item {
      position: relative;
      padding-left: 1.5rem;
      border-left: 2px solid var(--border);
    }

    .timeline-item::before {
      content: '';
      position: absolute;
      left: -5px;
      top: 0.35rem;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--text-main);
    }

    .timeline-date {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 0
